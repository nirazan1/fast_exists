name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.0', '3.1', '3.2', '3.3']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}

    - name: Install Dependencies
      run: bundle install

    - name: Run Test Suite (MiniTest)
      run: ruby spec/run_tests.rb

    - name: Run RSpec Tests
      run: bundle exec rspec || true

    - name: Test FastExists CLI Executable
      run: bin/fast_exists version && bin/fast_exists health
